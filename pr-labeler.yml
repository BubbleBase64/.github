  - "*urgent*"
  - "*critical*"
  - "*hotfix*"
  - "*security*"
  - "*🚨*"
  - "*🔥*"

"priority: low":
  - "*minor*"
  - "*typo*"
  - "*cleanup*"

# Breaking changes
"breaking change":
  - "*BREAKING*"
  - "*breaking change*"
  - "*💥*"

# Work in progress
"work in progress":
