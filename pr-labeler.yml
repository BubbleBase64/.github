# 🎯 Auto-labeling based on PR title patterns
# More info: https://github.com/TimonVS/pr-labeler-action

# Type labels based on conventional commit format
"type: feat":
  - "feat*"
  - "feature*" 
  - "✨*"

"type: fix":
  - "fix*"
  - "bugfix*"
  - "🐛*"
  - "🐞*"

"type: docs":
  - "docs*"
  - "documentation*"
  - "📚*"
  - "📝*"

"type: style":
  - "style*"
  - "formatting*"
  - "💄*"

"type: refactor":
  - "refactor*"
  - "refactoring*"
  - "♻️*"

"type: perf":
  - "perf*"
  - "performance*"
  - "⚡*"

"type: test":
  - "test*"
  - "testing*"
  - "🧪*"
  - "✅*"

"type: chore":
  - "chore*"
  - "maintenance*"
  - "🔧*"

"type: ci":
  - "ci*"
  - "continuous integration*"
  - "github actions*"
  - "workflow*"
  - "👷*"

# Scope labels
