name: 🏷️ Auto Label PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: 🏷️ Label PR based on files changed
        uses: actions/labeler@v4
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          configuration-path: .github/labeler.yml
          sync-labels: true

      - name: 🎯 Label PR based on size
        uses: pascalgn/size-label-action@v0.4.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          sizes: >
            {
              "0": "size: XS",
              "10": "size: S", 
              "50": "size: M",
              "200": "size: L",
              "800": "size: XL"
            }

      - name: 🚀 Label PR type based on title
        uses: TimonVS/pr-labeler-action@v3
        with:
          configuration-path: .github/pr-labeler.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📝 Comment on first-time contributor PR
        uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          pr-message: |
            🎉 **Welcome to the Bubbles Academic Project!** 
            
            Thank you for your contribution to our AI-powered news platform academic project! 
            
            Here's what happens next:
            - Our team will review your contribution within 48 hours
            - Make sure all checks pass (they should run automatically)
            - Feel free to ask questions in the comments or contact the team directly
            
            Please ensure you've read our [Contributing Guide](https://github.com/bubbles-org/.github/blob/main/CONTRIBUTING.md) and [Code of Conduct](https://github.com/bubbles-org/.github/blob/main/CODE_OF_CONDUCT.md).
            
            Thanks for helping us build innovative academic research tools! 🫧✨